spring.application.name=agenda-online-backend

# Configuración de la Base de Datos MySQL (usando variables de entorno o valores seguros por defecto)
spring.datasource.url=jdbc:mysql://localhost:3306/agenda_online?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect